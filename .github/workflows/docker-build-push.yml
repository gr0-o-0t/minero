name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (e.g. p2pool)"
        required: true
        type: string

      tag_prefix:
        description: "Tag prefix (e.g. p2pool-)"
        required: true
        type: string

      context:
        description: "Docker build context"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREFIX="${{ inputs.tag_prefix }}"

          if [[ "$TAG" != "$PREFIX"* ]]; then
            echo "Tag '$TAG' does not match prefix '$PREFIX'"
            exit 1
          fi

          VERSION="${TAG#$PREFIX}"
          SERVICE="${{ inputs.service }}"

          echo "SERVICE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE" >> $GITHUB_ENV
          echo "SERVICE_NAME_UPPER=${SERVICE^^}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ inputs.service }}
          tags: |
            type=raw,value=${{ env.SERVICE_VERSION }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ env.SERVICE_NAME_UPPER }}_VERSION=${{ env.SERVICE_VERSION }}
