        with:
          context: ./monerod
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ env.SERVICE_NAME_UPPER }}_VERSION=${{ env.SERVICE_VERSION }}
